[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "krdpc"
dynamic = ["version"]
description = "A native KDE app that keeps a list of remote computers and opens each one with FreeRDP's xfreerdp"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = ["PySide6>=6.6", "keyring>=24"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
krdpc = "krdpc.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "krdpc.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
